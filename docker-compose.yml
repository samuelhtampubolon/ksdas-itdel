version: '3.8'

services:
  # 1. Antarmuka Web KSDAS & Reverse Proxy (Nginx)
  ksdas-frontend:
    image: nginx:alpine
    container_name: ksdas-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ksdas-api
      - ksdas-db
      - ksdas-storage
    networks:
      - ksdas-network

  # 2. REST API Backend Service (FastAPI)
  ksdas-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ksdas-api
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-ksdas_app}:${DB_PASSWORD:-GantiDenganPasswordDatabaseYangKuat2026!}@ksdas-db:5432/${DB_NAME:-ksdas_db}
      STORAGE_ENDPOINT: http://ksdas-storage:9000
      STORAGE_ACCESS_KEY: ${S3_ACCESS_KEY:-ksdas_minio_admin}
      STORAGE_SECRET_KEY: ${S3_SECRET_KEY:-GantiDenganMinioSecretAman2026!}
      KSDAS_ENV: production
      LOG_LEVEL: info
    depends_on:
      - ksdas-db
      - ksdas-storage
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ksdas-network

  # 3. Basis Data PostgreSQL Resmi Kampus IT Del
  ksdas-db:
    image: postgres:16-alpine
    container_name: ksdas-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ksdas_db}
      POSTGRES_USER: ${DB_USER:-ksdas_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-GantiDenganPasswordDatabaseYangKuat2026!}
    volumes:
      - ksdas_db_data:/var/lib/postgresql/data
      - ./docs/schema_production_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ksdas-network

  # 3. Object Storage MinIO S3 (Penyimpanan Berkas MoU, PKS & Bukti Fisik)
  ksdas-storage:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: ksdas-storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ksdas_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-GantiDenganMinioSecretAman2026!}
    volumes:
      - ksdas_s3_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - ksdas-network

networks:
  ksdas-network:
    driver: bridge

volumes:
  ksdas_db_data:
    driver: local
  ksdas_s3_data:
    driver: local
