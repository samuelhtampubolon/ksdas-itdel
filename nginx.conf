# ==============================================================================
# KSDAS IT DEL - NGINX (reverse proxy + berkas statis), konfigurasi ketat
# Hanya berkas web yang diizinkan (allowlist). Folder lain (docs, backend, tests,
# basis data lokal, berkas biner) TIDAK pernah dilayani.
# TLS/HSTS: aktifkan blok 443 setelah sertifikat resmi dari SDI/TSI tersedia.
# ==============================================================================
limit_req_zone $binary_remote_addr zone=ksdas_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    # Header keamanan (tidak ditimpa di location lain: jangan memakai add_header di location)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Setelah HTTPS aktif di blok 443:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm;

    # Allowlist berkas web
    location = / { try_files /index.html =404; }
    location = /index.html { expires -1; }
    location ^~ /css/ { expires 1h; }
    location ^~ /js/ { expires 1h; }
    location ^~ /sample-data/uji/ { expires 1h; }

    # API (di belakang SSO/gateway produksi)
    location /api/ {
        limit_req zone=ksdas_api burst=40 nodelay;
        proxy_pass http://ksdas-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Selain allowlist di atas: tolak (dotfile, docs, backend, .exe, .zip, dsb.)
    location / { return 404; }
}
